<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnityWorld - 世界模拟</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
</head>
<body>
    <!-- 顶部工具栏 -->
    <header class="toolbar">
        <div class="toolbar-left">
            <button id="btnPause" class="btn btn-icon" title="暂停/继续">⏸</button>
            <button id="btnSettings" class="btn btn-icon" title="设置">⚙</button>
            <button id="btnLogs" class="btn btn-icon" title="日志">📋</button>
        </div>
        <div class="toolbar-center">
            <span class="title">🌍 世界模拟</span>
            <span id="gameTime" class="time">第 1 年 1 月 1 日</span>
        </div>
        <div class="toolbar-right">
            <button id="btnSpeedDown" class="btn btn-sm">0.5x</button>
            <span id="speedDisplay" class="speed">1x</span>
            <button id="btnSpeedUp" class="btn btn-sm">2x</button>
            <button id="btnStep" class="btn btn-sm">单步</button>
        </div>
    </header>

    <!-- 主体区域 -->
    <main class="main">
        <!-- 左侧面板：地块详情 -->
        <aside class="panel panel-left" id="tilePanel">
            <div class="panel-header">
                <h3>📍 地块详情</h3>
                <button class="btn-close" onclick="closePanel('tilePanel')">×</button>
            </div>
            <div class="panel-content" id="tileContent">
                <p class="hint">点击地图上的地块查看详情</p>
            </div>
        </aside>

        <!-- 中央地图 -->
        <div class="map-container">
            <canvas id="mapCanvas"></canvas>
            <div id="tooltip" class="tooltip hidden"></div>
        </div>

        <!-- 右侧面板：NPC 详情 -->
        <aside class="panel panel-right" id="npcPanel">
            <div class="panel-header">
                <h3>👤 NPC 面板</h3>
                <button class="btn-close" onclick="closePanel('npcPanel')">×</button>
            </div>
            <div class="panel-content" id="npcContent">
                <p class="hint">点击地图上的 NPC 查看详情</p>
            </div>
        </aside>
    </main>

    <!-- 底部：行为卡区域 -->
    <footer class="action-bar" id="actionBar">
        <div class="action-bar-header">
            <h3>Action Cards</h3>
        </div>
        <div class="action-cards" id="BehaviorCards">
            <p class="hint">选中 NPC 后可查看可用的行为卡</p>
        </div>
    </footer>

    <!-- 日志弹窗 -->
    <div class="modal hidden" id="logModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📋 系统日志</h3>
                <button class="btn-close" onclick="closeModal('logModal')">×</button>
            </div>
            <div class="log-list" id="logList"></div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal hidden" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙ 设置</h3>
                <button class="btn-close" onclick="closeModal('settingsModal')">×</button>
            </div>
            <div class="settings-form">
                <div class="form-group">
                    <label>显示五行元气</label>
                    <input type="checkbox" id="showAura" checked>
                </div>
                <div class="form-group">
                    <label>显示 NPC 图标</label>
                    <input type="checkbox" id="showNpcs" checked>
                </div>
                <div class="form-group">
                    <label>地图缩放</label>
                    <input type="range" id="zoomLevel" min="0.5" max="3" step="0.1" value="1">
                </div>
            </div>
        </div>
    </div>

    <!-- 连接状态指示器 -->
    <div class="connection-status" id="connectionStatus">
        <span class="status-dot disconnected"></span>
        <span class="status-text">断开连接</span>
    </div>

    <script src="js/game-client.js"></script>
    <script src="js/canvas-renderer.js"></script>
</body>
</html>
